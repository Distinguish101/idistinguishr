name: Build, push, and deploy

# On every push to main: build + push both container images to GHCR, re-run
# the Prisma migration Job, then roll the Deployment to the new image tag.
#
# Requires a `KUBE_CONFIG` repository secret: a kubeconfig (or cloud-specific
# auth resolving to one) for a service account with access to the
# `idistinguishr` namespace, base64-encoded — e.g.:
#   cat ~/.kube/config | base64 -w0
# Set this up once the cluster exists (see docs/k8s-deploy.md and the
# migration log for what's still outstanding). This workflow will fail at
# the "Configure kubeconfig" step until that secret is set.
#
# GHCR push uses the repo's built-in GITHUB_TOKEN — no separate registry
# account or credentials needed.

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # Docker image refs must be lowercase; github.repository preserves the
      # repo's actual case (Distinguish101/idistinguishr), so it can't be used
      # directly — GHCR would reject an uppercase push.
      - id: image
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built for both amd64 and arm64: the current cluster (Oracle Cloud
      # Ampere A1) is arm64, but a future move to a typical amd64 managed
      # cluster (DOKS, EKS, etc.) shouldn't require touching this workflow.
      # arm64 is emulated via QEMU on this amd64 runner, so builds are slower
      # than single-arch — acceptable for this app's release cadence.
      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.tag.outputs.tag }}
            ${{ steps.image.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrate image (builder stage — has the prisma CLI)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.image }}:migrate
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"

      - name: Re-run migration job
        run: |
          kubectl delete job idistinguishr-migrate -n idistinguishr --ignore-not-found
          kubectl apply -f k8s/migration-job.yaml
          kubectl wait --for=condition=complete job/idistinguishr-migrate -n idistinguishr --timeout=180s

      - name: Roll deployment to the new image
        run: |
          kubectl set image deployment/idistinguishr \
            idistinguishr=${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.tag }} \
            -n idistinguishr
          kubectl rollout status deployment/idistinguishr -n idistinguishr --timeout=180s
