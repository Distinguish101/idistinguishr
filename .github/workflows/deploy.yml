name: Build, push, and deploy

# On every push to main: build + push both container images to GHCR, re-run
# the Prisma migration Job, then roll the Deployment to the new image tag.
#
# Requires a `KUBE_CONFIG` repository secret: a kubeconfig (or cloud-specific
# auth resolving to one) for a service account with access to the
# `idistinguishr` namespace, base64-encoded — e.g.:
#   cat ~/.kube/config | base64 -w0
# Set this up once the cluster exists (see docs/k8s-deploy.md and the
# migration log for what's still outstanding). This workflow will fail at
# the "Configure kubeconfig" step until that secret is set.
#
# GHCR push uses the repo's built-in GITHUB_TOKEN — no separate registry
# account or credentials needed.

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    # Native arm64 runner (free for public repos): the cluster is arm64, so
    # building here avoids emulating ARM under QEMU, which made builds take
    # 10-20 minutes and occasionally stall.
    runs-on: ubuntu-24.04-arm
    # A newer push supersedes an older build still in flight.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # Docker image refs must be lowercase; github.repository preserves the
      # repo's actual case (Distinguish101/idistinguishr), so it can't be used
      # directly — GHCR would reject an uppercase push.
      - id: image
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # arm64 only: the cluster (Oracle Cloud Ampere A1) is arm64. Moving to
      # an amd64 cluster later means adding linux/amd64 back here (build it on
      # a native amd64 runner in a matrix and merge the manifests).
      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.tag.outputs.tag }}
            ${{ steps.image.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrate image (builder stage — has the prisma CLI)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.image }}:migrate
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    # Deploys run one at a time and are never cancelled mid-rollout, so two
    # overlapping runs can't leave an older image on the cluster.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"

      - name: Re-run migration job
        run: |
          kubectl delete job idistinguishr-migrate -n idistinguishr --ignore-not-found
          kubectl apply -f k8s/migration-job.yaml
          kubectl wait --for=condition=complete job/idistinguishr-migrate -n idistinguishr --timeout=180s

      # Applies the full manifest (with the image tag substituted), not just
      # `kubectl set image` — that way, manifest-level changes committed to
      # k8s/deployment.yaml (env vars, resources, probes, ...) actually reach
      # the cluster on every release, not just image bumps.
      - name: Roll deployment to the new image
        run: |
          sed "s|image: ${{ needs.build-and-push.outputs.image }}:.*|image: ${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.tag }}|" \
            k8s/deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment/idistinguishr -n idistinguishr --timeout=180s
