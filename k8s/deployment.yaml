apiVersion: apps/v1
kind: Deployment
metadata:
  name: idistinguishr
  namespace: idistinguishr
  labels:
    app: idistinguishr
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Capacity must never drop during a rollout.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: idistinguishr
  template:
    metadata:
      labels:
        app: idistinguishr
    spec:
      containers:
        - name: idistinguishr
          image: ghcr.io/distinguish101/idistinguishr:latest # replace with a real tag/git SHA per release, see docs/k8s-deploy.md
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: idistinguishr-secrets
          env:
            # Jaeger's OTLP HTTP receiver, in the same namespace — see
            # k8s/jaeger.yaml. src/instrumentation.ts's OTLPTraceExporter
            # appends /v1/traces itself.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger.idistinguishr.svc.cluster.local:4318
            - name: OTEL_DEPLOYMENT_ENVIRONMENT
              value: k8s
            # Auth.js rejects requests whose Host doesn't match what it
            # trusts by default — fine on Vercel (inherently trusted), but
            # self-hosted behind a reverse proxy (Traefik here) the pod only
            # sees its own internal 0.0.0.0:3000, not the real public host.
            # This tells Auth.js to trust Traefik's X-Forwarded-* headers
            # instead. See https://errors.authjs.dev#untrustedhost.
            - name: AUTH_TRUST_HOST
              value: "true"
            # @vercel/otel traces 100% of requests by default — including
            # every liveness/readiness probe hit (2 pods x every ~10-15s),
            # which OOMKilled Jaeger's Badger storage within days of
            # unsampled volume. parentbased_traceidratio + 0.1 samples ~10%
            # of root traces (any trace already in progress, e.g. one
            # containing an error, is still carried through in full once
            # sampled in — this only affects the initial sampling decision).
            # See https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/#general-sdk-configuration.
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health?ready=1
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
