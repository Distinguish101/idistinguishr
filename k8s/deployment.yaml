apiVersion: apps/v1
kind: Deployment
metadata:
  name: idistinguishr
  namespace: idistinguishr
  labels:
    app: idistinguishr
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Capacity must never drop during a rollout.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: idistinguishr
  template:
    metadata:
      labels:
        app: idistinguishr
    spec:
      containers:
        - name: idistinguishr
          image: ghcr.io/distinguish101/idistinguishr:latest # replace with a real tag/git SHA per release, see docs/k8s-deploy.md
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: idistinguishr-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health?ready=1
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
