# Referenced by k8s/ingress.yaml via the cert-manager.io/cluster-issuer
# annotation. Uses ACME HTTP-01 validation through Traefik — Let's Encrypt
# reaches http://<domain>/.well-known/acme-challenge/... on the cluster's
# public IP, so this ClusterIssuer only works once DNS actually points at
# the cluster (see docs/k8s-deploy.md's cutover steps). Applying this
# manifest before then is harmless; it just won't issue anything yet.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: idistinguish@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
