# TEMPLATE ONLY — do not apply this file as-is and do not commit real values.
#
# Copy this file out (e.g. `cp secret.example.yaml secret.yaml`, which is
# already .gitignored — see the repo root .gitignore), fill in every value
# below by copying directly from the Vercel dashboard (Project Settings ->
# Environment Variables), then:
#
#   kubectl apply -f secret.yaml
#
# ...and delete the local secret.yaml file immediately afterwards. Never type
# or paste real values into chat with an AI assistant, never commit them, and
# never leave the filled-in file lying around on disk.
apiVersion: v1
kind: Secret
metadata:
  name: idistinguishr-secrets
  namespace: idistinguishr
type: Opaque
stringData:
  # Postgres connection string — external, managed (Neon/Supabase). This
  # migration does not move or touch the database; it must keep pointing at
  # the exact same instance the Vercel deployment uses.
  DATABASE_URL: "postgresql://user:password@host:5432/idistinguishr"

  # Auth.js — generate with `npx auth secret`, or reuse the existing Vercel value.
  AUTH_SECRET: "REPLACE_ME"

  # Google OAuth (leave blank to disable the Google sign-in button — see src/lib/auth.ts)
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""

  # Stripe Connect
  STRIPE_SECRET_KEY: "REPLACE_ME"
  STRIPE_PUBLISHABLE_KEY: "REPLACE_ME"
  # Must match the signing secret of whichever Stripe webhook endpoint currently
  # targets this deployment — see docs/k8s-deploy.md's cutover notes. This is
  # the one value that fails silently if wrong: bookings complete client-side
  # but never get server-confirmed.
  STRIPE_WEBHOOK_SECRET: "REPLACE_ME"

  # Resend (confirmation emails)
  RESEND_API_KEY: "REPLACE_ME"

  # Comma-separated emails allowed onto /admin (teacher approval)
  ADMIN_EMAILS: "REPLACE_ME"

  # Anthropic (automated first-pass teacher vetting). Leave unset to skip AI
  # vetting entirely — profiles just stay PENDING for manual review.
  ANTHROPIC_API_KEY: ""

  # Absolute site URL — used only in the admin-review-needed email. Point this
  # at the k8s ingress domain once DNS is cut over (see docs/k8s-deploy.md).
  SITE_URL: "https://idistinguishr.vercel.app"
