# Optional. Requires metrics-server to be installed in the cluster.
#   kubectl apply -f k8s/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: idistinguishr
  namespace: idistinguishr
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: idistinguishr
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
